<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#8ACE00"/>

  <!-- neck, drawn first so the head and the shirt both sit over it -->
  <rect x="106" y="146" width="44" height="72" rx="16" fill="#E8A87C" stroke="#08265C" stroke-width="9"/>

  <!-- shoulders -->
  <path d="M34 256 q0 -60 94 -60 q94 0 94 60 z" fill="#2FA84F" stroke="#08265C" stroke-width="9" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="56" cy="126" r="17" fill="#E8A87C" stroke="#08265C" stroke-width="8"/>
  <circle cx="200" cy="126" r="17" fill="#E8A87C" stroke="#08265C" stroke-width="8"/>

  <!-- head -->
  <ellipse cx="128" cy="120" rx="72" ry="68" fill="#E8A87C" stroke="#08265C" stroke-width="9"/>

  <g fill="#D9581F" stroke="#08265C" stroke-width="7">
       <circle cx="88" cy="66" r="20"/><circle cx="128" cy="52" r="23"/><circle cx="168" cy="66" r="20"/>
     </g>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="154" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="105" cy="117" r="8" fill="#08265C"/>
    <circle cx="157" cy="117" r="8" fill="#08265C"/>
  </g>
  <g fill="none" stroke="#08265C" stroke-width="8" stroke-linecap="round">
    <circle cx="102" cy="114" r="27"/><circle cx="154" cy="114" r="27"/>
    <line x1="129" y1="114" x2="127" y2="114"/>
    <line x1="75" y1="108" x2="60" y2="116"/><line x1="181" y1="108" x2="196" y2="116"/>
  </g>
  

  <path d="M106 154 q22 18 44 0" fill="none" stroke="#08265C" stroke-width="8" stroke-linecap="round"/>
</svg>
