<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#8ACE00"/>

  <!-- neck, drawn first so the head and the shirt both sit over it -->
  <rect x="106" y="146" width="44" height="72" rx="16" fill="#6F4527" stroke="#08265C" stroke-width="9"/>

  <!-- shoulders -->
  <path d="M34 256 q0 -60 94 -60 q94 0 94 60 z" fill="#F07A1A" stroke="#08265C" stroke-width="9" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="56" cy="126" r="17" fill="#6F4527" stroke="#08265C" stroke-width="8"/>
  <circle cx="200" cy="126" r="17" fill="#6F4527" stroke="#08265C" stroke-width="8"/>

  <!-- head -->
  <ellipse cx="128" cy="120" rx="72" ry="68" fill="#6F4527" stroke="#08265C" stroke-width="9"/>

  <g stroke="#08265C" stroke-width="7" stroke-linejoin="round">
       <path d="M66 80 q4 -46 62 -46 q58 0 62 46 z" fill="#FFD200"/>
       <rect x="60" y="74" width="136" height="18" rx="9" fill="#FFD200"/>
     </g>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="154" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="105" cy="117" r="8" fill="#08265C"/>
    <circle cx="157" cy="117" r="8" fill="#08265C"/>
  </g>
  
  

  <ellipse cx="128" cy="160" rx="13" ry="16" fill="#08265C"/>
</svg>
