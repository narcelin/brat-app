<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#8ACE00"/>

  <!-- neck, drawn first so the head and the shirt both sit over it -->
  <rect x="106" y="146" width="44" height="72" rx="16" fill="#FBE0C4" stroke="#08265C" stroke-width="9"/>

  <!-- shoulders -->
  <path d="M34 256 q0 -60 94 -60 q94 0 94 60 z" fill="#17A6A6" stroke="#08265C" stroke-width="9" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="56" cy="126" r="17" fill="#FBE0C4" stroke="#08265C" stroke-width="8"/>
  <circle cx="200" cy="126" r="17" fill="#FBE0C4" stroke="#08265C" stroke-width="8"/>

  <!-- head -->
  <ellipse cx="128" cy="120" rx="72" ry="68" fill="#FBE0C4" stroke="#08265C" stroke-width="9"/>

  <path d="M72 74 q30 -40 92 -22 q-28 -2 -44 12 q-24 -6 -48 10 z" fill="#E8C24A" stroke="#08265C" stroke-width="7" stroke-linejoin="round"/>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="154" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="105" cy="117" r="8" fill="#08265C"/>
    <circle cx="157" cy="117" r="8" fill="#08265C"/>
  </g>
  
  <g fill="#08265C" opacity=".55"><circle cx="84" cy="140" r="4"/><circle cx="96" cy="148" r="4"/><circle cx="160" cy="148" r="4"/><circle cx="172" cy="140" r="4"/></g>

  <path d="M106 154 q22 18 44 0" fill="none" stroke="#08265C" stroke-width="8" stroke-linecap="round"/>
</svg>
