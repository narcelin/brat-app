<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#8ACE00"/>

  <!-- neck, drawn first so the head and the shirt both sit over it -->
  <rect x="106" y="146" width="44" height="72" rx="16" fill="#F9D7B7" stroke="#08265C" stroke-width="9"/>

  <!-- shoulders -->
  <path d="M34 256 q0 -60 94 -60 q94 0 94 60 z" fill="#E8467C" stroke="#08265C" stroke-width="9" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="56" cy="126" r="17" fill="#F9D7B7" stroke="#08265C" stroke-width="8"/>
  <circle cx="200" cy="126" r="17" fill="#F9D7B7" stroke="#08265C" stroke-width="8"/>

  <!-- head -->
  <ellipse cx="128" cy="120" rx="72" ry="68" fill="#F9D7B7" stroke="#08265C" stroke-width="9"/>

  <g fill="#F2B705" stroke="#08265C" stroke-width="7" stroke-linejoin="round">
       <circle cx="46" cy="74" r="26"/><circle cx="210" cy="74" r="26"/>
       <path d="M62 78 q10 -46 66 -46 q56 0 66 46 q-66 -22 -132 0 z"/>
     </g>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="154" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="105" cy="117" r="8" fill="#08265C"/>
    <circle cx="157" cy="117" r="8" fill="#08265C"/>
  </g>
  
  

  <ellipse cx="128" cy="160" rx="13" ry="16" fill="#08265C"/>
</svg>
