<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#8ACE00"/>

  <!-- neck, drawn first so the head and the shirt both sit over it -->
  <rect x="106" y="146" width="44" height="72" rx="16" fill="#F2C9A0" stroke="#08265C" stroke-width="9"/>

  <!-- shoulders -->
  <path d="M34 256 q0 -60 94 -60 q94 0 94 60 z" fill="#1C63C8" stroke="#08265C" stroke-width="9" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="56" cy="126" r="17" fill="#F2C9A0" stroke="#08265C" stroke-width="8"/>
  <circle cx="200" cy="126" r="17" fill="#F2C9A0" stroke="#08265C" stroke-width="8"/>

  <!-- head -->
  <ellipse cx="128" cy="120" rx="72" ry="68" fill="#F2C9A0" stroke="#08265C" stroke-width="9"/>

  <path d="M48 96 q0 -60 80 -60 q80 0 80 60 l0 78 q-16 -40 -26 -62 q-54 18 -108 0 q-10 22 -26 62 z" fill="#6B3410" stroke="#08265C" stroke-width="7" stroke-linejoin="round"/>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="154" cy="114" r="19" fill="#fff" stroke="#08265C" stroke-width="7"/>
    <circle cx="105" cy="117" r="8" fill="#08265C"/>
    <circle cx="157" cy="117" r="8" fill="#08265C"/>
  </g>
  
  

  <g><path d="M104 152 q24 26 48 0 z" fill="#08265C"/><path d="M120 168 q8 16 16 0 z" fill="#FF6B8A" stroke="#08265C" stroke-width="5"/></g>
</svg>
